[package]
name = "local"
version = "0.1.0"
edition = "2021"
publish = false
links = "local"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
kv = { path = "../kv" }
cxx = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
glob = "=0.3.2"
parquet = { version = "=56.2.0", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }

[build-dependencies]
cxx-build = "1"
